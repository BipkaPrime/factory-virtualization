[technology-description]
# Stage 1: MK1
FV-mk1-root=Intermediate components required to unlock the true potential of your factory.
FV-template-control-center-mk1=Heart of virtualization system. You only need to build one. Must be constructed on [planet=aquilo].
FV-template-computation-array-mk1=Vital part of any virtualization system. Produces [font=default-bold]computation[/font] used to create production templates. Must be constructed on [planet=aquilo] in proximity to an active [entity=FV-template-control-center-mk1].
FV-template-item-io-mk1=Required for creation of templates with item inputs or outputs. Used as source/sink for items on [font=default-bold]virtualization surfaces[/font].
FV-template-fluid-io-mk1=Required for creation of templates with fluid inputs or outputs. Used as source/sink for fluids on [font=default-bold]virtualization surfaces[/font].
FV-template-energy-io-mk1=Required for creation of templates with energy input or output. Used as source/sink for energy on [font=default-bold]virtualization surfaces[/font].
FV-compile-any-template=Now that you have access to all required buildings, you need to compile a production template. I'm not giving you a step-by-step guide here: it would be extremely boring. If you are confused, check out [font=default-bold]tips and tricks[/font] for more information.
FV-virtualization-clusters=Congratulations on compiling your first production template!\nIf you are wondering what's it good for, it can be [font=default-bold]executed[/font] inside [font=default-bold]virtualization clusters[/font] to produce template outputs from template inputs. However, to assemble one, you will have to do more research.\nClusters are formed from special entities (following technologies) which are called [font=default-bold]cluster members[/font].\nTo add an entity to the cluster, you need to create it first. You can do it in [font=default-bold]clusters[/font] tab of [font=default-bold]template control center GUI[/font].\nCheck out [font=default-bold]tips and tricks[/font] for more information.
FV-template-access-interface-mk1=To execute a production template, cluster needs to have access to it. This entity is used to provide the access.\nIt's a bit more complicated than just adding this entity to the cluster. Check out [font=default-bold]tips and tricks[/font] for more information.
FV-virtualization-mainframe-mk1=To execute a production template, cluster needs [font=default-bold]crafting power[/font]. This entity can provide it to the cluster.\nHowever, before it can operate, it needs to construct the template. It will request construction materials via logistic network.
FV-cluster-storage-unit-mk1=To execute a production template, cluster needs space in its input and output buffers. This entity can provide both.\nNote that one entity can expand the buffer for only one resouce, so you'll need a few of these.
FV-cluster-item-io-mk1=To execute a production template, cluster needs input ingredients. This entity is used to transfer items between the "real" world and internal buffers of the cluster.
FV-cluster-fluid-io-mk1=To execute a production template, cluster needs input ingredients. This entity is used to transfer fluids between the "real" world and internal buffers of the cluster.
FV-cluster-energy-io-mk1=To execute a production template, cluster needs input ingredients. This entity is used to transfer energy between the "real" world and internal buffers of the cluster.
FV-inter-cluster-bridge-mk1=This entity is [font=default-bold]not required[/font] to assemble your first fully operational cluster. However you will soon find that moving resources through the "real" world is slow and boring.\nThis entity can transfer your resources directly from the output of one cluster to the input of another. Furthermore, its transfer speed is about 10000 times greater than regular IOs. Can work with items, fluids and energy.
FV-cluster-overflow-controller-mk1=This entity is [font=default-bold]not required[/font] to assemble your first fully operational cluster. However it's a nice thing to have.\nVoids overflow in the output buffer of its cluster. Overflow threshold and voiding speed can be configured.
# Stage 2: MK2
FV-mk2-root=Produce 250M [item=processing-unit] in the span of 1 hour to unlock.\nIntermediate components required for the next major leap in the production.
FV-template-control-center-mk2=[font=default-bold]Proximity distance[/font] and [font=default-bold]maximum template complexity[/font] are 2 times greater compared to [entity=FV-template-control-center-mk1].
FV-template-computation-array-mk2=Can output a 1000x more [font=default-bold]computation[/font] than [entity=FV-template-computation-array-mk1] at only 10x energy consumption, making it 100x more energy-efficient.
FV-template-access-interface-mk2=[font=default-bold]Maximum template complexity[/font] is 2 times higher compared to [entity=FV-template-access-interface-mk1].
FV-template-item-io-mk2=Transfer rate is 10 times higher compared to [entity=FV-template-item-io-mk1].
FV-template-fluid-io-mk2=Transfer rate is 10 times higher compared to [entity=FV-template-fluid-io-mk1].
FV-template-energy-io-mk2=Transfer rate is 10 times higher compared to [entity=FV-template-energy-io-mk1].
FV-virtualization-mainframe-mk2=Can provide 10 times more [font=default-bold]crafting power[/font] compared to [entity=FV-virtualization-mainframe-mk1]. Regularly, requests 10x template construction materials.
FV-cluster-storage-unit-mk2=Can provide 1000 times more buffer capacity compared to [entity=FV-cluster-storage-unit-mk1].
FV-cluster-item-io-mk2=Transfer rate is 10 times higher compared to [entity=FV-cluster-item-io-mk1].
FV-cluster-fluid-io-mk2=Transfer rate is 10 times higher compared to [entity=FV-cluster-fluid-io-mk1].
FV-cluster-energy-io-mk2=Transfer rate is 10 times higher compared to [entity=FV-cluster-energy-io-mk1].
FV-inter-cluster-bridge-mk2=Transfer rate is 1000 times higher compared to [entity=FV-inter-cluster-bridge-mk1].
FV-cluster-overflow-controller-mk2=Maximum voiding rate is 1000 times higher compared to [entity=FV-cluster-overflow-controller-mk1].
# Stage 3: MK3
FV-mk3-root=Produce 5G [item=quantum-processor] in the span of 1 hour to unlock.\nIntermediate components required for the final leap in the production. You already know the drill.
FV-template-control-center-mk3=[font=default-bold]Proximity distance[/font] and [font=default-bold]maximum template complexity[/font] are 2 times greater compared to [entity=FV-template-control-center-mk2].
FV-template-computation-array-mk3=Can output a 1000x more [font=default-bold]computation[/font] than [entity=FV-template-computation-array-mk2] at only 10x energy consumption, making it 100x more energy-efficient.
FV-template-access-interface-mk3=[font=default-bold]Maximum template complexity[/font] is 2 times higher compared to [entity=FV-template-access-interface-mk2].
FV-template-item-io-mk3=Transfer rate is 10 times higher compared to [entity=FV-template-item-io-mk2].
FV-template-fluid-io-mk3=Transfer rate is 10 times higher compared to [entity=FV-template-fluid-io-mk2].
FV-template-energy-io-mk3=Transfer rate is 10 times higher compared to [entity=FV-template-energy-io-mk2].
FV-virtualization-mainframe-mk3=Can provide 10 times more [font=default-bold]crafting power[/font] compared to [entity=FV-virtualization-mainframe-mk2]. Regularly, requests 10x template construction materials.
FV-cluster-storage-unit-mk3=Can provide 1000 times more buffer capacity compared to [entity=FV-cluster-storage-unit-mk2].
FV-cluster-item-io-mk3=Transfer rate is 10 times higher compared to [entity=FV-cluster-item-io-mk2].
FV-cluster-fluid-io-mk3=Transfer rate is 10 times higher compared to [entity=FV-cluster-fluid-io-mk2].
FV-cluster-energy-io-mk3=Transfer rate is 10 times higher compared to [entity=FV-cluster-energy-io-mk2].
FV-inter-cluster-bridge-mk3=Transfer rate is 1000 times higher compared to [entity=FV-inter-cluster-bridge-mk2].
FV-cluster-overflow-controller-mk3=Maximum voiding rate is 1000 times higher compared to [entity=FV-cluster-overflow-controller-mk2].
# victory
FV-victory=Produce 3.6T [item=quantum-processor] in the span of 1 hour to win. By the way, that equates to 1G [item=quantum-processor] per second. Not sure if it's even possible, but you could become the first person to complete this insane goal!