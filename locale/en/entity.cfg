[entity-description]
FV-cluster-item-io-mk1=Cluster member. Used to transfer items between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]120/s + 50%[/font] per quality level (additive).
FV-cluster-item-io-mk2=Cluster member. Used to transfer items between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]1200/s + 50%[/font] per quality level (additive).
FV-cluster-item-io-mk3=Cluster member. Used to transfer items between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]12k/s + 50%[/font] per quality level (additive).
FV-cluster-fluid-io-mk1=Cluster member. Used to transfer fluids between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]1200/s + 50%[/font] per quality level (additive).
FV-cluster-fluid-io-mk2=Cluster member. Used to transfer fluids between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]12k/s + 50%[/font] per quality level (additive).
FV-cluster-fluid-io-mk3=Cluster member. Used to transfer fluids between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]120k/s + 50%[/font] per quality level (additive).
FV-cluster-energy-io-mk1=Cluster member. Used to transfer energy between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]240MW + 50%[/font] per quality level (additive).
FV-cluster-energy-io-mk2=Cluster member. Used to transfer energy between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]2.4GW + 50%[/font] per quality level (additive).
FV-cluster-energy-io-mk3=Cluster member. Used to transfer energy between the "real" world and internal buffers of the cluster.\nTransfer rate: [font=default-bold]24GW + 50%[/font] per quality level (additive).
FV-inter-cluster-bridge-mk1=Cluster member. Used to transfer resources directly from the output of one cluster to the input of another.\nTransfer rate:\nItems: [font=default-bold]1M/s + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]10M/s + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]1TW + 50%[/font] per quality level (additive).
FV-inter-cluster-bridge-mk2=Cluster member. Used to transfer resources directly from the output of one cluster to the input of another.\nTransfer rate:\nItems: [font=default-bold]1G/s + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]10G/s + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]1PW + 50%[/font] per quality level (additive).
FV-inter-cluster-bridge-mk3=Cluster member. Used to transfer resources directly from the output of one cluster to the input of another.\nTransfer rate:\nItems: [font=default-bold]1T/s + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]10T/s + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]1EW + 50%[/font] per quality level (additive).
FV-cluster-overflow-controller-mk1=Cluster member. Used to void overflow in the output buffer of the cluster.\nTransfer rate:\nItems: [font=default-bold]1M/s + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]10M/s + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]1TW + 50%[/font] per quality level (additive).\nHas a configurable overflow threshold. X% threshold means anything above X% is considered an overflow and will be voided.
FV-cluster-overflow-controller-mk2=Cluster member. Used to void overflow in the output buffer of the cluster.\nTransfer rate:\nItems: [font=default-bold]1G/s + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]10G/s + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]1PW + 50%[/font] per quality level (additive).\nHas a configurable overflow threshold. X% threshold means anything above X% is considered an overflow and will be voided.
FV-cluster-overflow-controller-mk3=Cluster member. Used to void overflow in the output buffer of the cluster.\nTransfer rate:\nItems: [font=default-bold]1T/s + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]10T/s + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]1EW + 50%[/font] per quality level (additive).\nHas a configurable overflow threshold. X% threshold means anything above X% is considered an overflow and will be voided.
FV-virtualization-mainframe-mk1=Cluster member. Used to provide [font=default-bold]1 crafting power[/font] to its cluster. Needs to construct the template before it becomes operational. Will request construction materials via logistic network.
FV-virtualization-mainframe-mk2=Cluster member. Used to provide [font=default-bold]10 crafting power[/font] to its cluster. Needs to construct the template before it becomes operational. Will request construction materials via logistic network.
FV-virtualization-mainframe-mk3=Cluster member. Used to provide [font=default-bold]100 crafting power[/font] to its cluster. Needs to construct the template before it becomes operational. Will request construction materials via logistic network.
FV-cluster-storage-unit-mk1=Cluster member. Used to increase the size of input or output cluster buffer. Capacity provided:\nItems: [font=default-bold]100k + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]1M + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]100GJ + 50%[/font] per quality level (additive).
FV-cluster-storage-unit-mk2=Cluster member. Used to increase the size of input or output cluster buffer. Capacity provided:\nItems: [font=default-bold]100M + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]1G + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]100TJ + 50%[/font] per quality level (additive).
FV-cluster-storage-unit-mk3=Cluster member. Used to increase the size of input or output cluster buffer. Capacity provided:\nItems: [font=default-bold]100G + 50%[/font] per quality level (additive).\nFluids:[font=default-bold]1T + 50%[/font] per quality level (additive).\nEnergy:[font=default-bold]100PJ + 50%[/font] per quality level (additive).
FV-template-item-io-mk1=Used in creation of templates on virtualization surfaces. Serves as a source/sink for items.\n[font=default-bold]Does not work on any other surfaces[/font].\n[font=default-bold]Source mode[/font] — port materializes resources and records them as template inputs.\n[font=default-bold]Sink mode[/font] — port destroys resources and records them as template outputs.\nTransfer rate: [font=default-bold]120/s + 50%[/font] per quality level (additive).
