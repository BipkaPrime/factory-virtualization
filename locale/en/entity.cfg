FV-template-computation-array-mk1=Produces [font=default-bold]computation[/font] used to create production templates. Only works on [planet=aquilo] in proximity to an active [entity=FV-template-control-center-mk1].\nMax computation: [font=default-bold]1k + 50%[/font] per quality level (additive).\nMax energy consumption: [font=default-bold]750MW[/font].\nCurrent energy consumption depends on computation demand.
FV-template-computation-array-mk2=Produces [font=default-bold]computation[/font] used to create production templates. Only works on [planet=aquilo] in proximity to an active [entity=FV-template-control-center-mk1].\nMax computation: [font=default-bold]1M + 50%[/font] per quality level (additive).\nMax energy consumption: [font=default-bold]7.5GW[/font].\nCurrent energy consumption depends on computation demand.
FV-template-computation-array-mk3=Produces [font=default-bold]computation[/font] used to create production templates. Only works on [planet=aquilo] in proximity to an active [entity=FV-template-control-center-mk1].\nMax computation: [font=default-bold]1G + 50%[/font] per quality level (additive).\nMax energy consumption: [font=default-bold]75GW[/font].\nCurrent energy consumption depends on computation demand.
FV-template-control-center-mk1=The heart of virtualization system. Must be constructed on [planet=aquilo]. Required for:\n[font=default-bold]1.[/font] Creating and maintaining virtualization surfaces.\n[font=default-bold]2.[/font] Compiling those surfaces into production templates.\n[font=default-bold]3.[/font] Granting access to compiled templates.\nOnly one [entity=FV-template-control-center-mk1] can be active at a time.\nProximity distance: [font=default-bold]250 + 20%[/font] per quality level (additive).\nMax virtualization overhead: [font=default-bold]500MW + 20%[/font] per quality level (additive). Corresonds to [font=default-bold]3.03 + ~0.2-0.3[/font] max template complexity (scale is logarithmic).
FV-template-control-center-mk2=The heart of virtualization system. Must be constructed on [planet=aquilo]. Required for:\n[font=default-bold]1.[/font] Creating and maintaining virtualization surfaces.\n[font=default-bold]2.[/font] Compiling those surfaces into production templates.\n[font=default-bold]3.[/font] Granting access to compiled templates.\nOnly one [entity=FV-template-control-center-mk2] can be active at a time.\nProximity distance: [font=default-bold]500 + 20%[/font] per quality level (additive).\nMax virtualization overhead: [font=default-bold]5GW + 20%[/font] per quality level (additive). Corresonds to [font=default-bold]6.06 + ~0.2-0.3[/font] max template complexity (scale is logarithmic).
FV-template-control-center-mk3=The heart of virtualization system. Must be constructed on [planet=aquilo]. Required for:\n[font=default-bold]1.[/font] Creating and maintaining virtualization surfaces.\n[font=default-bold]2.[/font] Compiling those surfaces into production templates.\n[font=default-bold]3.[/font] Granting access to compiled templates.\nOnly one [entity=FV-template-control-center-mk3] can be active at a time.\nProximity distance: [font=default-bold]1000 + 20%[/font] per quality level (additive).\nMax virtualization overhead: [font=default-bold]50GW + 20%[/font] per quality level (additive). Corresonds to [font=default-bold]9.09 + ~0.2-0.3[/font] max template complexity (scale is logarithmic).
FV-template-access-interface-mk1=Used to provide access for production template to the cluster. Behavior depends on transmission mode:\n[font=default-bold]Transmit mode[/font]: must be placed on [planet=aquilo] in proximity to an active [entity=FV-template-control-center-mk1]. Transmits selected template to selected cluster.\n[font=default-bold]Receive mode[/font]: placed as a member of the target cluster. Receives selected template for selected cluster.\nAccess to template X is granted for cluster Y when template X is being transmitted to cluster Y and received for cluster Y.\nMax virtualization overhead: [font=default-bold]500MW + 20%[/font] per quality level (additive). Corresonds to [font=default-bold]3.03 + ~0.2-0.3[/font] max template complexity (scale is logarithmic).
FV-template-access-interface-mk2=Used to provide access for production template to the cluster. Behavior depends on transmission mode:\n[font=default-bold]Transmit mode[/font]: must be placed on [planet=aquilo] in proximity to an active [entity=FV-template-control-center-mk1]. Transmits selected template to selected cluster.\n[font=default-bold]Receive mode[/font]: placed as a member of the target cluster. Receives selected template for selected cluster.\nAccess to template X is granted for cluster Y when template X is being transmitted to cluster Y and received for cluster Y.\nMax virtualization overhead: [font=default-bold]5GW + 20%[/font] per quality level (additive). Corresonds to [font=default-bold]6.06 + ~0.2-0.3[/font] max template complexity (scale is logarithmic).
