[mod-description]
factory-virtualization=Grow your Factory past all known limits!\nDiscover a way to compile your production lines into production templates. Replace millions of physical machines with virtualization clusters executing your templates for real production. Clusters are assembled from specialized buildings. Add more crafting power by building more virtualization mainframes; add more storage by building more storage units.\nComplete the mod by building a digital empire that will make the biggest Space Age megabases look like simple starter bases.\nProgression starts on Aquilo. You can add the mod to an existing save (don't forget to back it up).