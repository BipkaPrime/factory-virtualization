[tips-and-tricks-item-description]
FV-tip1=Recent research has brought a new idea that can potentially expand the Factory past all known limits.\nYou have discovered a way to compress a production line into a mathematical model called a "production template" (or just "template").\nThese compiled templates can later be used for real production, replacing physical machines.\nHowever, this process is complex and demanding. It will require serious infrastructure and further research.
FV-tip2=A template is a mathematical model of a production chain containing four key components:\n[font=default-bold]1.[/font] Inputs — resources consumed per second.\n[font=default-bold]2.[/font] Outputs — products generated per second.\n[font=default-bold]3.[/font] Construction cost — materials required to "construct" the template (think of it as a capital investment: machines, inserters, belts that would normally form the physical line).\n[font=default-bold]4.[/font] Virtualization overhead — additional electrical power consumed per cycle. This value also determines template complexity.
FV-tip3=[entity=FV-template-control-center-mk1] is the core building of the virtualization system. It is required for:\n[font=default-bold]1.[/font] Creating and maintaining virtualization surfaces.\n[font=default-bold]2.[/font] Compiling those surfaces into production templates.\n[font=default-bold]3.[/font] Granting access to compiled templates.\n\nOnly one [entity=FV-template-control-center-mk1] can be active at a time. Additional [entity=FV-template-control-center-mk1] will remain idle while active one exists and has power.\nThe [entity=FV-template-control-center-mk1] must be placed on [planet=aquilo], where extreme cold provides the necessary cooling for its quantum processors.\n\nEach [entity=FV-template-control-center-mk1] has two important attributes:\n[font=default-bold]Proximity distance[/font] — certain buildings must be placed within this radius to function.\n[font=default-bold]Max template complexity[/font] — the maximum complexity of templates this [entity=FV-template-control-center-mk1] can compile.\n[entity=FV-template-control-center-mk2] and [entity=FV-template-control-center-mk3] have higher attributes. Additionally, the quality of the building further improves these values.
FV-tip4=[font=default-bold]Computation[/font] is a "resource" required for template creation. It is a flow-variable meaning that it cannot be buffered in any way.\nIt is produced by [entity=FV-template-computation-array-mk1] placed within the [font=default-bold]proximity distance[/font] of an active [entity=FV-template-control-center-mk1].\nEnergy consumption of [entity=FV-template-computation-array-mk1] scales with current computation demand.\nMaximum computation output and energy efficiency are much higher for [entity=FV-template-computation-array-mk2] and [entity=FV-template-computation-array-mk3].\nAdditionally, the quality of the building further improves these values.
FV-tip5=A [font=default-bold]virtualization surface[/font] (vsurface for short) is a sandbox dimension used for creation of production templates.\nYou are not intended to have physical access to these surfaces and should interact with them via map view.\nSurface conditions are not applied to these surfaces: you are free to build any entities and run any recipes here. However labs don't work here.\nTo create a new template, the production chain must be constructed on a vsurface and then compilation of that surface should be started.\nWhen the compilation process successfully finishes, a compiled template will be created.\nHigher surface area results in template's virtualization overhead and complexity increase.\nVsurface can be created [font=default-bold]empty[/font] or [font=default-bold]with resources[/font] by using mapgen of any planet. Template complexity for the latter option is significantly higher.
FV-tip6=Maintaining the existence of virtualization surfaces requires [font=default-bold]computation[/font].\nThe amount required scales with surface area. It is also higher if the surface was generated with any planet's mapgen. When a surface is compiling, its computation demand increases [font=default-bold]tenfold[/font].\n[color=red]Important:[/color] computation demand cannot exceed the supply. In case there is a deficit, compilations are terminated one by one, then vsurfaces are deleted one by one, until there is no deficit.\nComputation deficit can occur for two reasons:\n[font=default-bold]1.[/font] [entity=FV-template-computation-array-mk1] has shut down due to not having enough energy, or was deconstructed or destoroyed.\n[font=default-bold]2.[/font] An active [entity=FV-template-control-center-mk1] has shut down due to not having enough energy, or was deconstructed or destoroyed.
FV-tip7=One should think of a vsurface as a virtual sandbox. Any production chain can be constructed here for "free".\nFollowing is performed automatically: ghosts are revived, deconstruction and update requests fulfilled, item requests are satisfied.\nJust place your blueprints and they will be constructed automatically. This however does not work when surface is compiling.\n\nTemplate inputs and outputs of the constructed production chain are defined by special IO ports:\n[entity=FV-template-item-io-mk1], [entity=FV-template-fluid-io-mk1], [entity=FV-template-energy-io-mk1].\nRegularly, template input and output can only contain items, fluids and electric energy.\n\nEach port has two operation modes:\n[font=default-bold]Source mode[/font] — port materializes resources and records them as template inputs.\n[font=default-bold]Sink mode[/font] — port destroys resources and records them as template outputs.
FV-tip8=During compilation, the system performs periodic validation checks on the compiling vsurface.\nThe final check is performed just before the template is created. If it fails template will not be created.\nEarlier checks only update the validation report and cannot interrupt the compilation process.\n\nThis validation verifies the material balance for every resource. There are four components considered:\n[font=default-bold]1. Inputs[/font] — resources spawned by IO ports during compilation.\n[font=default-bold]2. Outputs[/font] — resources destroyed by IO ports during compilation.\n[font=default-bold]3. Produced[/font] — resources produced on this vsurface (production statistics).\n[font=default-bold]4. Consumed[/font] — resources consumed on this vsurface (production statistics).\nValidation is passed if [font=default-bold]Input + Produced == Output + Consumed[/font]. A relative deviation of less than 1% is considered acceptable.\n\nCommon reasons for validation failure:\n[font=default-bold]1. Input sum > Output sum[/font] — more of a resource arrived than left. Meaning that a buffer is building up somewhere (e.g. items accumulating in a chest).\n[font=default-bold]2. Input sum < Output sum[/font] — more of a resource left than arrived. Meaning that a buffered is decreasing somewhere (e.g. items are being taken out of a chest and sent to output).\n[font=default-bold]3. Items destroyed by lava or any other tile[/font] — these are not recorded in production statistics and will cause an imbalance.\n[font=default-bold]4. Production chain has not yet reached a steady state[/font] — run it longer before compiling to stabilize it.\nThe validation report allows you to see deviations for all resources. It's bound to the specific vsurface: you can check it in [font=default-bold]surfaces[/font] tab of [font=default-bold]template control center GUI[/font].
FV-tip9=[font=default-bold]Construction cost[/font] of the template is the total materials required to build everything present on the vsurface at the end of compilation — all buildings, modules, and tiles.\nOn a vsurface you can build anything for free. However, when you later deploy this template in the "real" world, you will need to provide all these materials as a one-time capital investment.
FV-tip10=[font=default-bold]Virtualization clusters[/font] (or simply clusters) are simulated "factories" that produce resources by executing a production template.\nClusters can be created and deleted by the player in [font=default-bold]clusters[/font] tab of [font=default-bold]template control center GUI[/font].\nEach cluster is bound to a surface specified on its creation. Clusters can consume and produce items, fluids, and electric energy. The cluster can craft only when is has an assigned template and it's accessible.\n\nClusters are formed from buildings which are can be cluster members:\n[font=default-bold]1.[/font] [entity=FV-cluster-item-io-mk1], [entity=FV-cluster-fluid-io-mk1], [entity=FV-cluster-energy-io-mk1] — transfer resources between the "real" world and the cluster's internal buffer.\n[font=default-bold]2.[/font] [entity=FV-virtualization-mainframe-mk1] — provides [font=default-bold]crafting power[/font] to cluster. When the cluster has [font=default-bold]crafting power[/font] of N, it can execute N crafts per second.\n[font=default-bold]3.[/font] [entity=FV-cluster-storage-unit-mk1] — increases the size of the cluster's internal buffer.\n[font=default-bold]4.[/font] [entity=FV-cluster-overflow-controller-mk1] — voids overflow in the output buffer.\n[font=default-bold]4.[/font] [entity=FV-inter-cluster-bridge-mk1] — directly transfers resources from output of one cluster to input of another.\n[font=default-bold]5.[/font] [entity=FV-template-access-interface-mk1] — in [font=default-bold]receive[/font] mode only, it requests access to the selected template. Access is only granted when another [entity=FV-template-access-interface-mk1] is transmitting this template to this cluster.\nA building can only become a member of the cluster if they are on the same surface.
FV-tip11=Energy consumption of a cluster depends not only on the template it is executing, but also on how spread out its members are.\nThe [font=default-bold]decentralization loss[/font] is an additional energy cost that increases with the distance between cluster members. It is applied multiplicatively to the base energy cost of template execution.\nThe loss is proportional to the average squared distance from the position of cluster members to cluster center.\nThe center is calculated as the weighted average of all member positions. The loss does not scale with the number of members — only their distribution matters.\n\nEvery cluster member has a weight associated with it:\n[entity=FV-cluster-item-io-mk1], [entity=FV-cluster-fluid-io-mk1], [entity=FV-cluster-energy-io-mk1] have a weight of 1.\n[entity=FV-virtualization-mainframe-mk1] has a weight of 10.\n[entity=FV-cluster-overflow-controller-mk1], [entity=FV-inter-cluster-bridge-mk1] have a weight of 20. \n[entity=FV-cluster-storage-unit-mk1] has a weight of 100.\n[entity=FV-template-access-interface-mk1] has a weight of 1000.\nWeight of a building increases tenfold for each tier above 1. For example, [entity=FV-cluster-item-io-mk3] has a weight of 100.
FV-tip12=A cluster cannot execute a template unless it has access to it. Two [entity=FV-template-access-interface-mk1] are required to provide template access to one cluster:\nOne in [font=default-bold]transmit[/font] mode near an active [entity=FV-template-control-center-mk1].\nAnother in [font=default-bold]receive[/font] mode placed as a member of the target cluster.\nConnection is established when both [entity=FV-template-access-interface-mk1] are operational and linked to the same template and cluster.\nA cluster can only have one assigned template at a time. A template can be assigned to any number of clusters.\nMaximum complexity of the template [entity=FV-template-access-interface-mk1] can work with is limited. It is higher for [entity=FV-template-access-interface-mk2] and [entity=FV-template-access-interface-mk3]. It also scales with building quality.
FV-tip13=Each production template has an associated complexity value ranging from 0 to 10.\nIt is calculated from the template's virtualization overhead on a logarithmic scale:\n[font=default-bold]•[/font] Complexity 0 corresponds to 50 MJ overhead.\n[font=default-bold]•[/font] Complexity 10 corresponds to 100 GJ overhead.\n[entity=FV-template-control-center-mk1] and [entity=FV-template-access-interface-mk1] have a maximum complexity limit based on their tier and quality.